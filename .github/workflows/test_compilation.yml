name: CI Zappy

on:
  push:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:

  ci:
    name: Build, Test & Clean
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build zappy_server
        run: |
          make zappy_server
          if [ ! -x "./zappy_server" ]; then
            echo "::error::zappy_server is missing or not executable"
            exit 1
          fi

      - name: Build zappy_ai
        run: |
          make zappy_ai
          if [ ! -x "./zappy_ai" ]; then
            echo "::error::zappy_ai is missing or not executable"
            exit 1
          fi

      - name: Run unit tests
        run: make tests_run

      - name: Make fclean and check rules
        run: |
          make all

          make clean
          found=$(find . \( -name "*.o" -o -name "*.gcno" -o -name "*.gcda" -o -name "*~" -o -name "#*#" -o -name "*.tmp" \) -print -quit)
          if [ -n "$found" ]; then
            echo "::error::temporary/object file still exists after clean: $found"
            exit 1
          fi
          if [ ! -x "./zappy_server" ] || [ ! -x "./zappy_ai" ]; then
            echo "::error::clean rule deleted executables"
            exit 1
          fi

          make fclean
          if [ -e "./zappy_server" ] || [ -e "./zappy_ai" ]; then
            echo "::error::fclean did not remove executables"
            exit 1
          fi
