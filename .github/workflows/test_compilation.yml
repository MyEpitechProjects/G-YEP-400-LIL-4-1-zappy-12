name: CI Zappy

on:
  push:
  workflow_dispatch:

# Allows you to define the Docker image for ALL jobs and avoids having to perform complex "docker run" commands at each step
defaults:
  run:
    shell: bash

jobs:

  # JOB 1: Server compilation
  build_server:
    name: Build zappy_server
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make zappy_server
        run: make zappy_server

      - name: Check server executable
        run: |
          if [ ! -x "./zappy_server" ]; then
            echo "::error::zappy_server is missing or not executable"
            exit 1
          fi

  # JOB 2: AI Compilation (Runs in parallel with the server)
  build_ai:
    name: Build zappy_ai
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make zappy_ai
        run: make zappy_ai

      - name: Check ai executable
        run: |
          if [ ! -x "./zappy_ai" ]; then
            echo "::error::zappy_ai is missing or not executable"
            exit 1
          fi

  # JOB 3: Unit Tests (Only runs if builds pass)
  unit_tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker:latest
    # The keyword "needs" ensures that if a build fails, the tests will not run.
    needs: [build_server, build_ai, build_gui]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make tests_run
        run: make tests_run

  # JOB 5: Cleaning & Checks (Only starts if tests pass)
  clean_checks:
    name: Make fclean and Check rules
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker:latest
    # Ensure that the tests are green before testing fclean
    needs: unit_tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Makefile rules (all, clean, fclean)
        run: |
          # 1. Compile tout
          make all
          
          # 2. Test du clean (conserve les binaires)
          make clean
          found=$(find . \( -name "*.o" -o -name "*.gcno" -o -name "*.gcda" -o -name "*~" -o -name "#*#" -o -name "*.tmp" \) -print -quit)
          if [ -n "$found" ]; then
            echo "::error::temporary/object file still exists after clean: $found"
            exit 1
          fi
          if [ ! -x "./zappy_server" ] || [ ! -x "./zappy_ai" ]; then
            echo "::error::clean rule deleted executables"
            exit 1
          fi

          # 3. Test du fclean (supprime tout)
          make fclean
          if [ -e "./zappy_server" ] || [ -e "./zappy_ai" ] || [ -e "./zappy_gui" ]; then
            echo "::error::fclean did not remove executables"
            exit 1
          fi